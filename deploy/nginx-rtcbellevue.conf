# Nginx site for rtcbellevue.com on eli.
# Install: sudo cp deploy/nginx-rtcbellevue.conf /etc/nginx/sites-available/rtcbellevue
#          sudo ln -s ../sites-available/rtcbellevue /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Listens on localhost only. Public traffic arrives through the Cloudflare
# Tunnel (cloudflared ingress -> http://localhost:8081), which also terminates
# TLS — so there is no 443 block and no certbot here.
# Any host other than (www.)rtcbellevue.com — e.g. a preview hostname — gets
# noindex so search engines don't index the preview copy.
map $http_host $rtc_robots {
    default                        "noindex, nofollow";
    ~*^(www\.)?rtcbellevue\.com$   "";
}

server {
    listen 127.0.0.1:8081;
    server_name rtcbellevue.com www.rtcbellevue.com;

    root /var/www/rtcbellevue/dist;
    index index.html;

    # Behind the tunnel nginx only sees http://localhost:8081 — send relative
    # redirects (Location: /intro-1) so the browser keeps https + the real host.
    absolute_redirect off;
    add_header X-Robots-Tag $rtc_robots;   # empty value = header not sent

    # Canonical host is www (as on Squarespace).
    if ($http_host = rtcbellevue.com) {
        return 301 https://www.rtcbellevue.com$request_uri;
    }

    # Redirects for old Squarespace URLs (duplicates, renamed and dropped pages).
    include /etc/nginx/snippets/rtcbellevue-redirects.conf;  # = deploy/nginx-redirects.conf

    # Old URLs have no trailing slash: /claire is served by claire.html.
    location / {
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
