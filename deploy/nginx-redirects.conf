# Old Squarespace URLs -> new pages. Included by nginx-rtcbellevue.conf
# (install as /etc/nginx/snippets/rtcbellevue-redirects.conf).
# Real pages keep their old slugs, so only duplicates and dropped pages are here.

# Duplicates / renamed
location = /home               { return 301 /; }
location = /intro              { return 301 /services; }
location = /our-services       { return 301 /services; }
location = /meet-the-team      { return 301 /intro-1; }
location = /meet-the-team-1    { return 301 /intro-1; }
location = /meet-the-team-2    { return 301 /intro-1; }
location = /ares-of-focus      { return 301 /intro-2; }
location = /specialties        { return 301 /intro-2; }
location = /anxiety-stress     { return 301 /anxiety-stress-management; }

# Former clinician (profile kept in the repo with `hidden: true`)
location = /david              { return 301 /intro-1; }

# Squarespace template leftovers (fake retreat, demo products, cart)
location = /group-events       { return 301 /group-therapy; }
location ^~ /intro-0tOQM       { return 301 /services; }
location = /cart               { return 301 /; }

# Blog archives (categories/tags aren't rebuilt as pages)
location ^~ /blog/category/    { return 301 /blog; }
location ^~ /blog/tag/         { return 301 /blog; }
